<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Visualizações</title>
  <link rel="stylesheet" href="admin-pre-pos.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container-card">
    <h1>Painel de Controle</h1>
    <p>Métrica de acessos registrados na sua Landing Page:</p>
    
    <div class="contador-box" id="contadorAcessos">
      Carregando visualizações...
    </div>

    <a href="index.html" class="btn-acao">Ir para o Site</a>
  </div>

  <script>
    // Coloque aqui as mesmas chaves do Supabase que você usa no main.js
    const SUPABASE_URL = 'SUA_URL_AQUI'; 
    const SUPABASE_KEY = 'SUA_ANON_KEY_AQUI';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function carregarVisualizacoes() {
      try {
        // Conta o número de linhas na tabela 'acessos'
        const { count, error } = await supabaseClient
          .from('acessos')
          .select('*', { count: 'exact', head: true });

        if (error) {
          throw error;
        }

        document.getElementById('contadorAcessos').innerText = `${count !== null ? count : 0} Visualizações`;
      } catch (err) {
        console.error('Erro ao buscar acessos:', err);
        document.getElementById('contadorAcessos').innerText = 'Erro ao carregar dados';
      }
    }

    carregarVisualizacoes();
  </script>
</body>
</html>
