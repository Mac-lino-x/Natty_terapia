<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#c5d1b8">
  <title>Painel Administrativo - Gestão e Avaliações</title>
  <link rel="stylesheet" href="admin-pre-pos.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>

  <!-- LOGIN -->
  <div class="container-card login-box" id="telaLogin">
    <img class="login-logo" src="imagem/imagem1.png" alt="">
    <h1>Painel da Profissional</h1>
    <p class="login-sub">Acesso restrito</p>
    <form id="formLogin">
      <div class="form-group">
        <label for="loginEmail">E-mail:</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginSenha">Senha:</label>
        <input type="password" id="loginSenha" required autocomplete="current-password">
      </div>
      <p class="msg-erro" id="loginErro" role="alert"></p>
      <button type="submit" class="btn-acao" id="btnLogin" style="width:100%;">Entrar</button>
    </form>
  </div>

  <!-- PAINEL (só aparece após login) -->
  <div class="container-card admin-container" id="telaPainel" hidden>
    <div class="admin-topo">
      <div class="admin-marca">
        <img class="admin-logo" src="imagem/imagem1.png" alt="">
        <div>
          <h1>Painel da Profissional</h1>
          <p class="admin-sub">Natallyane Costa · Massoterapeuta</p>
        </div>
      </div>
      <button type="button" class="btn-acao btn-sair" id="btnSair">Sair</button>
    </div>

    <div class="contador-box" id="contadorAcessos">Carregando acessos...</div>

    <h2>Clientes</h2>
    <div id="listaClientes"><p class="empty-state">Carregando clientes...</p></div>
    <div id="clienteDetalhe"></div>

    <div style="text-align: center; margin-top: 24px;">
      <a href="index.html" class="btn-acao" style="display:inline-block; text-decoration:none;">Voltar para o Site</a>
    </div>
  </div>

  <!-- JANELA DE CONFIRMAÇÃO PARA APAGAR -->
  <div class="modal-fundo" id="modalApagar" hidden>
    <div class="modal-caixa" role="alertdialog" aria-modal="true" aria-labelledby="modalTexto">
      <p id="modalTexto">Tem certeza que deseja apagar?</p>
      <div class="modal-botoes">
        <button type="button" class="btn-acao btn-sim" id="btnApagarSim">Sim</button>
        <button type="button" class="btn-acao" id="btnApagarNao">Não</button>
      </div>
    </div>
  </div>

  <script>
    const telaLogin = document.getElementById('telaLogin');
    const telaPainel = document.getElementById('telaPainel');
    const loginErro = document.getElementById('loginErro');
    const esc = window.escapeHtml;
    let canalTempoReal = null;

    // Dados carregados do banco (da mais nova para a mais antiga)
    let listaPre = [];
    let listaPos = [];
    let clienteAberto = null;
    // Resumo + mensagem já gerados (ficam só na memória da página)
    const cacheResultado = new Map();

    const ICONE_LIXEIRA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';

    function classeDor(n) {
      n = Number(n) || 0;
      return n <= 3 ? 'dor-baixa' : (n <= 6 ? 'dor-media' : 'dor-alta');
    }

    function formatarData(iso) {
      return new Date(iso).toLocaleDateString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }

    function soData(iso) {
      return new Date(iso).toLocaleDateString('pt-BR');
    }

    function mostrarPainel(logado) {
      telaLogin.hidden = logado;
      telaPainel.hidden = !logado;
      if (logado) {
        carregarAcessos();
        carregarPreAtendimento();
        carregarAvaliacoes();
        iniciarTempoReal();
      } else {
        pararTempoReal();
        listaPre = [];
        listaPos = [];
        clienteAberto = null;
        cacheResultado.clear();
      }
    }

    async function carregarAcessos() {
      try {
        const { count, error } = await window.db
          .from('acessos')
          .select('*', { count: 'exact', head: true });
        if (error) throw error;
        document.getElementById('contadorAcessos').textContent =
          `${count ?? 0} Visualizações da Landing Page`;
      } catch (err) {
        console.error(err);
        document.getElementById('contadorAcessos').textContent = 'Não foi possível carregar os acessos.';
      }
    }

    async function carregarPreAtendimento() {
      try {
        const { data, error } = await window.db
          .from('pre_atendimento')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) throw error;
        listaPre = data || [];
        renderClientes();
      } catch (err) {
        console.error(err);
        document.getElementById('listaClientes').innerHTML = '<p class="empty-state">Erro ao carregar as fichas pré-atendimento.</p>';
      }
    }

    async function carregarAvaliacoes() {
      try {
        const { data, error } = await window.db
          .from('avaliacoes')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) throw error;
        listaPos = data || [];
        renderClientes();
      } catch (err) {
        console.error(err);
        document.getElementById('listaClientes').innerHTML = '<p class="empty-state">Erro ao carregar as avaliações.</p>';
      }
    }

    // =====================================================
    // CLIENTES: quem tem ficha PRÉ e/ou avaliação PÓS
    // (agrupa pelo nome, ignorando maiúsculas e acentos)
    // =====================================================
    function normalizar(s) {
      return String(s || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function montarClientes() {
      const mapa = new Map();
      function pegar(chave, nome) {
        if (!mapa.has(chave)) mapa.set(chave, { chave, nome, pres: [], poss: [], ultimo: 0 });
        return mapa.get(chave);
      }
      listaPre.forEach(p => {
        const k = normalizar(p.nome_cliente);
        if (!k) return;
        const c = pegar(k, p.nome_cliente);
        c.pres.push(p);
        c.ultimo = Math.max(c.ultimo, new Date(p.created_at).getTime());
      });
      listaPos.forEach(p => {
        const k = normalizar(p.nome_cliente);
        if (!k) return;
        const c = pegar(k, p.nome_cliente);
        c.poss.push(p);
        c.ultimo = Math.max(c.ultimo, new Date(p.created_at).getTime());
      });
      // quem atendeu/respondeu por último aparece primeiro
      return Array.from(mapa.values()).sort((a, b) => b.ultimo - a.ultimo);
    }

    function rotuloCliente(c) {
      if (c.pres.length && c.poss.length) return 'pré e pós';
      return c.pres.length ? 'só pré' : 'só pós';
    }

    function renderClientes() {
      const el = document.getElementById('listaClientes');
      const det = document.getElementById('clienteDetalhe');
      const clientes = montarClientes();

      if (clientes.length === 0) {
        el.innerHTML = '<p class="empty-state">Nenhum cliente ainda. Quando alguém preencher a ficha pré-sessão ou a avaliação pós-sessão, o nome aparece aqui.</p>';
        det.innerHTML = '';
        clienteAberto = null;
        return;
      }

      if (clienteAberto && !clientes.some(c => c.chave === clienteAberto)) clienteAberto = null;

      el.innerHTML = '<div class="resultados-lista">' + clientes.map(c => `
        <button type="button" class="resultado-chip ${c.chave === clienteAberto ? 'ativo' : ''}" data-chave="${esc(c.chave)}">${esc(c.nome)}<small>${rotuloCliente(c)}</small></button>
      `).join('') + '</div>' +
        (clienteAberto ? '' : '<p class="empty-state">Clique no nome de um cliente para ver as fichas, as avaliações e o resultado.</p>');

      const atual = clientes.find(c => c.chave === clienteAberto);
      if (!atual) { det.innerHTML = ''; return; }

      det.innerHTML = htmlCliente(atual);
      garantirResultado(atual);
    }

    function abrirCliente(chave) {
      clienteAberto = (clienteAberto === chave) ? null : chave;
      renderClientes();
      if (clienteAberto) {
        document.getElementById('clienteDetalhe').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // ---------- Cartões ----------
    function cardPre(item) {
      return `
        <div class="avaliacao-card">
          <button type="button" class="btn-lixeira" data-tabela="pre_atendimento" data-id="${esc(item.id)}" aria-label="Apagar ficha" title="Apagar ficha">${ICONE_LIXEIRA}</button>
          <h3>${esc(item.nome_cliente)} <span class="badge-dor ${classeDor(item.nivel_dor)}">Dor ${esc(item.nivel_dor)}/10</span></h3>
          <div class="detalhe-item"><strong>Técnica:</strong> ${esc(item.tecnica_desejada)} | <strong>Data:</strong> ${esc(formatarData(item.created_at))}</div>
          ${item.telefone ? `<div class="detalhe-item"><strong>Telefone:</strong> ${esc(item.telefone)}</div>` : ''}
          <div class="detalhe-item"><strong>Sintomas:</strong> ${esc(item.sintomas_queixas || 'Não informado')}</div>
          <div class="detalhe-item"><strong>Restrições:</strong> ${esc(item.restricoes_medicas || 'Nenhuma')}</div>
          ${item.respostas_pre ? `<div class="detalhe-item"><strong>Estado atual:</strong> ${esc(item.respostas_pre)}</div>` : ''}
        </div>`;
    }

    function cardPos(item) {
      const n = Math.min(5, Math.max(0, item.nota_estrelas || 0));
      const estrelasStr = '★'.repeat(n) + '☆'.repeat(5 - n);
      return `
        <div class="avaliacao-card">
          <button type="button" class="btn-lixeira" data-tabela="avaliacoes" data-id="${esc(item.id)}" aria-label="Apagar avaliação" title="Apagar avaliação">${ICONE_LIXEIRA}</button>
          <h3>${esc(item.nome_cliente)} <span class="estrelas-exibicao" aria-label="${n} de 5 estrelas">(${estrelasStr})</span></h3>
          <div class="detalhe-item"><strong>Técnica:</strong> ${esc(item.tecnica)} | <strong>Data:</strong> ${esc(formatarData(item.created_at))}</div>
          <div class="detalhe-item"><strong>Após a sessão:</strong> ${esc(item.respostas_pos || 'Não informado')}</div>
          <div class="detalhe-item"><strong>Feedback:</strong> ${esc(item.feedback || 'Nenhum comentário')}</div>
        </div>`;
    }

    function htmlCliente(c) {
      return `
        <div class="cliente-painel">
          <h3 class="cliente-nome">${esc(c.nome)}</h3>

          <h2>Fichas de Pré-Atendimento</h2>
          ${c.pres.length ? c.pres.map(cardPre).join('') : '<p class="empty-state">Este cliente ainda não preencheu a ficha pré-sessão.</p>'}

          <h2>Avaliações e Pós-Sessão</h2>
          ${c.poss.length ? c.poss.map(cardPos).join('') : '<p class="empty-state">Este cliente ainda não fez a avaliação pós-sessão.</p>'}

          <h2>Resultado</h2>
          ${htmlResultado(c)}
        </div>`;
    }

    // =====================================================
    // RESULTADO: resumo para a terapeuta + mensagem para o cliente
    // =====================================================
    function telefoneDe(c) {
      const ficha = c.pres.find(p => telefoneWhats(p.telefone));
      return ficha ? ficha.telefone : '';
    }

    // Aceita "(84) 99999-9999", "84999999999", "+55 84 99999-9999"...
    function telefoneWhats(tel) {
      let d = String(tel || '').replace(/\D/g, '');
      if (d.startsWith('00')) d = d.slice(2);
      if (d.length === 10 || d.length === 11) d = '55' + d;
      return (d.length === 12 || d.length === 13) ? d : '';
    }

    function htmlResultado(c) {
      const pre = c.pres[0];
      const pos = c.poss[0];

      if (!pre || !pos) {
        return `<p class="empty-state">O resultado aparece quando o cliente tiver a ficha pré-sessão e a avaliação pós-sessão (${!pre ? 'falta a ficha pré' : 'falta a avaliação pós'}).</p>`;
      }

      const r = cacheResultado.get(c.chave);
      if (!r || r.carregando) {
        return '<div class="resumo-painel"><p class="status-ia">Gerando o resumo e a mensagem com IA...</p></div>';
      }

      const temTel = !!telefoneWhats(telefoneDe(c));
      const varias = (c.pres.length > 1 || c.poss.length > 1)
        ? '<p class="nota-pequena">O resumo usa a ficha e a avaliação mais recentes deste cliente.</p>' : '';

      return `
        <div class="resumo-painel">
          <div class="resumo-bloco">
            <h4>Resumo para a terapeuta</h4>
            <p class="resumo-texto">${esc(r.resumo)}</p>
            ${varias}
          </div>

          <div class="resumo-acoes">
            <h4 style="font-size:0.72rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--salvia-profundo);">Mensagem pronta para o cliente</h4>
            <p class="status-ia">${r.usouIA
              ? 'Leia, edite se quiser e abra no WhatsApp.'
              : 'A IA não respondeu agora, então usei um texto padrão. Você pode editar antes de enviar.'}</p>
            <textarea class="msg-whats" id="textoMensagem" aria-label="Mensagem para o cliente">${esc(r.mensagem)}</textarea>
            ${temTel ? '' : '<p class="status-ia">Não há telefone válido nas fichas deste cliente para abrir o WhatsApp.</p>'}
            <div class="acoes-linha">
              <button type="button" class="btn-acao btn-whats btn-abrir-whats" ${temTel ? '' : 'disabled'}>Abrir no WhatsApp</button>
              <button type="button" class="btn-acao btn-sair btn-gerar-novamente">Gerar novamente</button>
            </div>
          </div>
        </div>`;
    }

    // ---------- Textos padrão (usados se a IA estiver indisponível) ----------
    // Arruma o que o cliente digitou: "RElaxado" -> "relaxado", tira vírgulas soltas no fim.
    // (Sem IA não dá para corrigir ortografia nem resumir com outras palavras.)
    function limparTexto(t) {
      return String(t || '')
        .replace(/\s+/g, ' ')
        .replace(/\s+([,;.])/g, '$1')
        .trim()
        .replace(/[\s,;.]+$/, '')
        .split(' ')
        .map(w => /[A-ZÀ-Ý]/.test(w.slice(1)) ? w.toLowerCase() : w)
        .join(' ');
    }

    function parLimpo(c) {
      const pre = c.pres[0];
      const pos = c.poss[0];
      return {
        pre: { ...pre,
          respostas_pre: limparTexto(pre.respostas_pre),
          sintomas_queixas: limparTexto(pre.sintomas_queixas),
          restricoes_medicas: limparTexto(pre.restricoes_medicas) },
        pos: { ...pos,
          respostas_pos: limparTexto(pos.respostas_pos),
          feedback: limparTexto(pos.feedback) }
      };
    }

    function resumoPadrao(c) {
      const { pre, pos } = parLimpo(c);
      const n = Math.min(5, Math.max(0, pos.nota_estrelas || 0));
      let t = `${pre.nome_cliente} chegou no dia ${soData(pre.created_at)} para uma sessão de ${pre.tecnica_desejada}, com dor/tensão ${pre.nivel_dor}/10`;
      t += pre.respostas_pre ? `, ${pre.respostas_pre.charAt(0).toLowerCase() + pre.respostas_pre.slice(1)}.` : '.';
      if (pre.sintomas_queixas) t += ` Queixas: ${pre.sintomas_queixas}.`;
      if (pre.restricoes_medicas) t += ` Informou como restrição/histórico: ${pre.restricoes_medicas}.`;
      t += ` Foi realizada ${pos.tecnica}.`;
      t += pos.respostas_pos ? ` Ao sair, relatou: ${pos.respostas_pos}.` : ' Ao sair, não detalhou como se sentiu.';
      t += ` Avaliou o atendimento com ${'★'.repeat(n)} (${n} de 5)`;
      t += pos.feedback ? ` e comentou: ${pos.feedback}.` : '.';
      return t;
    }

    function mensagemPadrao(c) {
      const { pre, pos } = parLimpo(c);
      const n = Math.min(5, Math.max(0, pos.nota_estrelas || 0));

      let chegada = `Você chegou para a sessão de *${pre.tecnica_desejada}* com nível de dor e tensão *${pre.nivel_dor}/10*.`;
      if (pre.respostas_pre) chegada += ` Seu estado no dia: ${pre.respostas_pre}.`;
      if (pre.sintomas_queixas) chegada += ` Suas queixas eram: ${pre.sintomas_queixas}.`;
      if (pre.restricoes_medicas) chegada += ` Você também informou: ${pre.restricoes_medicas}, e isso foi levado em consideração no cuidado.`;

      let saida = `Após a *${pos.tecnica}*,`;
      saida += pos.respostas_pos ? ` você contou que se sentiu: ${pos.respostas_pos}.` : ' foi um prazer cuidar de você.';
      saida += ` Sua avaliação foi ${'★'.repeat(n)} (${n}/5).`;
      if (pos.feedback) saida += ` Você ainda deixou este comentário: ${pos.feedback}. Muito obrigada!`;

      return `Olá, *${pre.nome_cliente}*! ✨\n\n` +
        `Passando para compartilhar o resumo do seu atendimento do dia *${soData(pre.created_at)}* e celebrar a sua evolução!\n\n` +
        `📥 *Como você chegou:*\n${chegada}\n\n` +
        `📤 *Como você saiu:*\n${saida}\n\n` +
        `💛 *Meu desejo para você:*\n` +
        `Quero que você se sinta sempre assim, leve, renovado e cada vez melhor! Não espere a tensão acumular: venha mais vezes e cuide sempre de você.\n\n` +
        `Até a próxima sessão! 🙌`;
    }

    // ---------- Geração (IA) ----------
    function garantirResultado(c) {
      const pre = c.pres[0];
      const pos = c.poss[0];
      if (!pre || !pos) return;
      const sig = pre.id + '-' + pos.id;
      const r = cacheResultado.get(c.chave);
      if (r && r.sig === sig) return;   // já gerado (ou gerando) para este par
      gerarResultado(c);
    }

    async function gerarResultado(c) {
      const pre = c.pres[0];
      const pos = c.poss[0];
      const r = { sig: pre.id + '-' + pos.id, carregando: true };
      cacheResultado.set(c.chave, r);

      try {
        const { data: sessao } = await window.db.auth.getSession();
        const token = sessao && sessao.session ? sessao.session.access_token : '';

        const resp = await fetch('/api/mensagem', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({
            nome: pre.nome_cliente,
            dataPre: soData(pre.created_at),
            dataPos: soData(pos.created_at),
            tecnicaDesejada: pre.tecnica_desejada,
            nivelDor: pre.nivel_dor,
            sintomas: pre.sintomas_queixas,
            restricoes: pre.restricoes_medicas,
            estadoAtual: pre.respostas_pre,
            tecnicaRealizada: pos.tecnica,
            nota: pos.nota_estrelas,
            comoSaiu: pos.respostas_pos,
            feedback: pos.feedback
          })
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const json = await resp.json();
        if (!json.resumo || !json.mensagem) throw new Error('resposta incompleta');
        r.resumo = json.resumo.trim();
        r.mensagem = json.mensagem.trim();
        r.usouIA = true;
      } catch (err) {
        console.error('IA indisponível, usando texto padrão:', err);
        r.resumo = resumoPadrao(c);
        r.mensagem = mensagemPadrao(c);
        r.usouIA = false;
      }

      r.carregando = false;
      // só atualiza a tela se ainda for o mesmo cliente e o mesmo resultado
      if (cacheResultado.get(c.chave) === r && clienteAberto === c.chave) renderClientes();
    }

    function abrirWhats(c) {
      const numero = telefoneWhats(telefoneDe(c));
      const caixa = document.getElementById('textoMensagem');
      const texto = caixa ? caixa.value.trim() : '';
      if (!numero || !texto) return;
      window.open('https://wa.me/' + numero + '?text=' + encodeURIComponent(texto), '_blank', 'noopener');
    }

    // Guarda o que você editar na mensagem (para não perder se a tela atualizar)
    document.addEventListener('input', (e) => {
      if (e.target.id !== 'textoMensagem' || !clienteAberto) return;
      const r = cacheResultado.get(clienteAberto);
      if (r) r.mensagem = e.target.value;
    });

    // Cliques nos nomes e nos botões (conteúdo criado dinamicamente)
    document.addEventListener('click', (e) => {
      const chip = e.target.closest('.resultado-chip');
      if (chip) { abrirCliente(chip.dataset.chave); return; }

      if (!clienteAberto) return;
      const c = montarClientes().find(x => x.chave === clienteAberto);
      if (!c) return;

      if (e.target.closest('.btn-gerar-novamente')) {
        gerarResultado(c);
        renderClientes();
        return;
      }
      if (e.target.closest('.btn-abrir-whats')) abrirWhats(c);
    });

    // ---------- Tempo real ----------
    function iniciarTempoReal() {
      pararTempoReal();
      canalTempoReal = window.db
        .channel('painel-admin')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pre_atendimento' }, carregarPreAtendimento)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'avaliacoes' }, carregarAvaliacoes)
        .subscribe();
    }

    function pararTempoReal() {
      if (canalTempoReal && window.db) {
        window.db.removeChannel(canalTempoReal);
        canalTempoReal = null;
      }
    }

    // ---------- Apagar com confirmação (Sim / Não) ----------
    const modalApagar = document.getElementById('modalApagar');
    const modalTexto = document.getElementById('modalTexto');
    const btnSim = document.getElementById('btnApagarSim');
    const btnNao = document.getElementById('btnApagarNao');
    let alvoApagar = null;

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn-lixeira');
      if (!btn) return;
      alvoApagar = { tabela: btn.dataset.tabela, id: btn.dataset.id };
      modalTexto.textContent = alvoApagar.tabela === 'avaliacoes'
        ? 'Tem certeza que deseja apagar esta avaliação?'
        : 'Tem certeza que deseja apagar esta ficha?';
      modalApagar.hidden = false;
      btnNao.focus();
    });

    function fecharModal() {
      modalApagar.hidden = true;
      alvoApagar = null;
    }

    btnNao.addEventListener('click', fecharModal);
    modalApagar.addEventListener('click', (e) => {
      if (e.target === modalApagar) fecharModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modalApagar.hidden) fecharModal();
    });

    btnSim.addEventListener('click', async () => {
      if (!alvoApagar) return;
      const { tabela, id } = alvoApagar;

      btnSim.disabled = true;
      btnNao.disabled = true;
      btnSim.textContent = 'Apagando...';

      // .select() devolve as linhas apagadas: se vier vazio, o banco recusou (política RLS)
      const { data, error } = await window.db.from(tabela).delete().eq('id', id).select();

      btnSim.disabled = false;
      btnNao.disabled = false;
      btnSim.textContent = 'Sim';
      fecharModal();

      if (error || !data || data.length === 0) {
        console.error(error);
        alert('Não foi possível apagar. Confirme que a política de exclusão foi criada no Supabase (supabase.sql).');
        return;
      }

      if (tabela === 'avaliacoes') carregarAvaliacoes();
      else carregarPreAtendimento();
    });

    // ---------- Login / Logout ----------
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      loginErro.textContent = '';
      if (!window.db) {
        loginErro.textContent = 'Supabase não configurado (edite config.js).';
        return;
      }
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      const { error } = await window.db.auth.signInWithPassword({
        email: document.getElementById('loginEmail').value.trim(),
        password: document.getElementById('loginSenha').value
      });

      btn.disabled = false;
      btn.textContent = 'Entrar';

      if (error) {
        loginErro.textContent = 'E-mail ou senha incorretos.';
      } else {
        document.getElementById('loginSenha').value = '';
        mostrarPainel(true);
      }
    });

    document.getElementById('btnSair').addEventListener('click', async () => {
      await window.db.auth.signOut();
      mostrarPainel(false);
    });

    // ---------- Início ----------
    (async function iniciar() {
      if (!window.db) {
        loginErro.textContent = 'Supabase não configurado (edite config.js).';
        return;
      }
      const { data } = await window.db.auth.getSession();
      mostrarPainel(!!data.session);

      window.db.auth.onAuthStateChange((evento) => {
        if (evento === 'SIGNED_OUT') mostrarPainel(false);
      });
    })();
  </script>
</body>
</html>
