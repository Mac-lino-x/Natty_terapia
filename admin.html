<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Gestão e Avaliações</title>
  <link rel="stylesheet" href="admin-pre-pos.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container-card admin-container">
    <h1>Painel da Profissional</h1>

    <div class="contador-box" id="contadorAcessos">Carregando acessos...</div>

    <h2>Fichas de Pré-Atendimento</h2>
    <div id="listaPreAtendimento"><p class="empty-state">Carregando fichas pré-sessão...</p></div>

    <h2>Avaliações e Pós-Sessão</h2>
    <div id="listaAvaliacoes"><p class="empty-state">Carregando avaliações...</p></div>

    <div style="text-align: center; margin-top: 24px;">
      <a href="index.html" class="btn-acao" style="display:inline-block; text-decoration:none;">Voltar para o Site</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'SUA_URL_AQUI';
    const SUPABASE_KEY = 'SUA_ANON_KEY_AQUI';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function formatarData(iso) {
      return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function carregarAcessos() {
      try {
        const { count } = await supabaseClient.from('acessos').select('*', { count: 'exact', head: true });
        document.getElementById('contadorAcessos').innerText = `${count !== null ? count : 0} Visualizações da Landing Page`;
      } catch (err) {
        console.error(err);
      }
    }

    async function carregarPreAtendimento() {
      const containerPre = document.getElementById('listaPreAtendimento');
      try {
        const { data, error } = await supabaseClient
          .from('pre_atendimento')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          containerPre.innerHTML = '<p class="empty-state">Nenhuma ficha pré-sessão cadastrada.</p>';
          return;
        }

        containerPre.innerHTML = '';
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'avaliacao-card';
          card.innerHTML = `
            <h3>${item.nome_cliente} (Dor: ${item.nivel_dor}/10)</h3>
            <div class="detalhe-item"><strong>Técnica:</strong> ${item.tecnica_desejada} | <strong>Data:</strong> ${formatarData(item.created_at)}</div>
            ${item.telefone ? `<div class="detalhe-item"><strong>Telefone:</strong> ${item.telefone}</div>` : ''}
            <div class="detalhe-item"><strong>Sintomas:</strong> ${item.sintomas_queixas || 'Não informado'}</div>
            <div class="detalhe-item"><strong>Restrições:</strong> ${item.restricoes_medicas || 'Nenhuma'}</div>
            ${item.respostas_pre ? `<div class="detalhe-item"><strong>Estado atual:</strong> ${item.respostas_pre}</div>` : ''}
          `;
          containerPre.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        containerPre.innerHTML = '<p class="empty-state">Erro ao carregar pré-atendimentos.</p>';
      }
    }

    async function carregarAvaliacoes() {
      const container = document.getElementById('listaAvaliacoes');
      try {
        const { data, error } = await supabaseClient
          .from('avaliacoes')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = '<p class="empty-state">Nenhuma avaliação cadastrada ainda.</p>';
          return;
        }

        container.innerHTML = '';
        data.forEach(item => {
          const estrelasStr = '★'.repeat(item.nota_estrelas || 0) + '☆'.repeat(5 - (item.nota_estrelas || 0));
          const card = document.createElement('div');
          card.className = 'avaliacao-card';
          card.innerHTML = `
            <h3>${item.nome_cliente} <span class="estrelas-exibicao">(${estrelasStr})</span></h3>
            <div class="detalhe-item"><strong>Técnica:</strong> ${item.tecnica} | <strong>Data:</strong> ${formatarData(item.created_at)}</div>
            <div class="detalhe-item"><strong>Após a sessão:</strong> ${item.respostas_pos || 'Não informado'}</div>
            <div class="detalhe-item"><strong>Feedback:</strong> ${item.feedback || 'Nenhum comentário'}</div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="empty-state">Erro ao carregar avaliações.</p>';
      }
    }

    function iniciarTempoReal() {
      supabaseClient
        .channel('painel-admin')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pre_atendimento' }, carregarPreAtendimento)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'avaliacoes' }, carregarAvaliacoes)
        .subscribe();
    }

    carregarAcessos();
    carregarPreAtendimento();
    carregarAvaliacoes();
    iniciarTempoReal();
  </script>
</body>
</html>
