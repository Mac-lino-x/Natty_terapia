<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel Administrativo - Gestão e Avaliações</title>
  <link rel="stylesheet" href="admin-pre-pos.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>

  <!-- LOGIN -->
  <div class="container-card login-box" id="telaLogin">
    <h1>Painel da Profissional</h1>
    <form id="formLogin">
      <div class="form-group">
        <label for="loginEmail">E-mail:</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginSenha">Senha:</label>
        <input type="password" id="loginSenha" required autocomplete="current-password">
      </div>
      <p class="msg-erro" id="loginErro" role="alert"></p>
      <button type="submit" class="btn-acao" id="btnLogin" style="width:100%;">Entrar</button>
    </form>
  </div>

  <!-- PAINEL (só aparece após login) -->
  <div class="container-card admin-container" id="telaPainel" hidden>
    <div class="admin-topo">
      <h1>Painel da Profissional</h1>
      <button type="button" class="btn-acao btn-sair" id="btnSair">Sair</button>
    </div>

    <div class="contador-box" id="contadorAcessos">Carregando acessos...</div>

    <h2>Fichas de Pré-Atendimento</h2>
    <div id="listaPreAtendimento"><p class="empty-state">Carregando fichas pré-sessão...</p></div>

    <h2>Avaliações e Pós-Sessão</h2>
    <div id="listaAvaliacoes"><p class="empty-state">Carregando avaliações...</p></div>

    <div style="text-align: center; margin-top: 24px;">
      <a href="index.html" class="btn-acao" style="display:inline-block; text-decoration:none;">Voltar para o Site</a>
    </div>
  </div>

  <script>
    const telaLogin = document.getElementById('telaLogin');
    const telaPainel = document.getElementById('telaPainel');
    const loginErro = document.getElementById('loginErro');
    const esc = window.escapeHtml;
    let canalTempoReal = null;

    function formatarData(iso) {
      return new Date(iso).toLocaleDateString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }

    function mostrarPainel(logado) {
      telaLogin.hidden = logado;
      telaPainel.hidden = !logado;
      if (logado) {
        carregarAcessos();
        carregarPreAtendimento();
        carregarAvaliacoes();
        iniciarTempoReal();
      } else {
        pararTempoReal();
      }
    }

    async function carregarAcessos() {
      try {
        const { count, error } = await window.db
          .from('acessos')
          .select('*', { count: 'exact', head: true });
        if (error) throw error;
        document.getElementById('contadorAcessos').textContent =
          `${count ?? 0} Visualizações da Landing Page`;
      } catch (err) {
        console.error(err);
        document.getElementById('contadorAcessos').textContent = 'Não foi possível carregar os acessos.';
      }
    }

    async function carregarPreAtendimento() {
      const el = document.getElementById('listaPreAtendimento');
      try {
        const { data, error } = await window.db
          .from('pre_atendimento')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) throw error;

        if (!data || data.length === 0) {
          el.innerHTML = '<p class="empty-state">Nenhuma ficha pré-sessão cadastrada.</p>';
          return;
        }

        el.innerHTML = data.map(item => `
          <div class="avaliacao-card">
            <h3>${esc(item.nome_cliente)} (Dor: ${esc(item.nivel_dor)}/10)</h3>
            <div class="detalhe-item"><strong>Técnica:</strong> ${esc(item.tecnica_desejada)} | <strong>Data:</strong> ${esc(formatarData(item.created_at))}</div>
            ${item.telefone ? `<div class="detalhe-item"><strong>Telefone:</strong> ${esc(item.telefone)}</div>` : ''}
            <div class="detalhe-item"><strong>Sintomas:</strong> ${esc(item.sintomas_queixas || 'Não informado')}</div>
            <div class="detalhe-item"><strong>Restrições:</strong> ${esc(item.restricoes_medicas || 'Nenhuma')}</div>
            ${item.respostas_pre ? `<div class="detalhe-item"><strong>Estado atual:</strong> ${esc(item.respostas_pre)}</div>` : ''}
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        el.innerHTML = '<p class="empty-state">Erro ao carregar pré-atendimentos.</p>';
      }
    }

    async function carregarAvaliacoes() {
      const el = document.getElementById('listaAvaliacoes');
      try {
        const { data, error } = await window.db
          .from('avaliacoes')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) throw error;

        if (!data || data.length === 0) {
          el.innerHTML = '<p class="empty-state">Nenhuma avaliação cadastrada ainda.</p>';
          return;
        }

        el.innerHTML = data.map(item => {
          const n = Math.min(5, Math.max(0, item.nota_estrelas || 0));
          const estrelasStr = '★'.repeat(n) + '☆'.repeat(5 - n);
          return `
            <div class="avaliacao-card">
              <h3>${esc(item.nome_cliente)} <span class="estrelas-exibicao" aria-label="${n} de 5 estrelas">(${estrelasStr})</span></h3>
              <div class="detalhe-item"><strong>Técnica:</strong> ${esc(item.tecnica)} | <strong>Data:</strong> ${esc(formatarData(item.created_at))}</div>
              <div class="detalhe-item"><strong>Após a sessão:</strong> ${esc(item.respostas_pos || 'Não informado')}</div>
              <div class="detalhe-item"><strong>Feedback:</strong> ${esc(item.feedback || 'Nenhum comentário')}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
        el.innerHTML = '<p class="empty-state">Erro ao carregar avaliações.</p>';
      }
    }

    function iniciarTempoReal() {
      pararTempoReal();
      canalTempoReal = window.db
        .channel('painel-admin')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pre_atendimento' }, carregarPreAtendimento)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'avaliacoes' }, carregarAvaliacoes)
        .subscribe();
    }

    function pararTempoReal() {
      if (canalTempoReal && window.db) {
        window.db.removeChannel(canalTempoReal);
        canalTempoReal = null;
      }
    }

    // ---------- Login / Logout ----------
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      loginErro.textContent = '';
      if (!window.db) {
        loginErro.textContent = 'Supabase não configurado (edite config.js).';
        return;
      }
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      const { error } = await window.db.auth.signInWithPassword({
        email: document.getElementById('loginEmail').value.trim(),
        password: document.getElementById('loginSenha').value
      });

      btn.disabled = false;
      btn.textContent = 'Entrar';

      if (error) {
        loginErro.textContent = 'E-mail ou senha incorretos.';
      } else {
        document.getElementById('loginSenha').value = '';
        mostrarPainel(true);
      }
    });

    document.getElementById('btnSair').addEventListener('click', async () => {
      await window.db.auth.signOut();
      mostrarPainel(false);
    });

    // ---------- Início ----------
    (async function iniciar() {
      if (!window.db) {
        loginErro.textContent = 'Supabase não configurado (edite config.js).';
        return;
      }
      const { data } = await window.db.auth.getSession();
      mostrarPainel(!!data.session);

      window.db.auth.onAuthStateChange((evento) => {
        if (evento === 'SIGNED_OUT') mostrarPainel(false);
      });
    })();
  </script>
</body>
</html>
