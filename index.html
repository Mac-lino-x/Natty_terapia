<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natallyane Costa - Massoterapeuta</title>
  <link rel="stylesheet" href="Style.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- VÍDEO DE FUNDO -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="video.mp4" type="video/mp4">
    Seu navegador não suporta vídeos.
  </video>

  <!-- CAMADA DE ESCURECIMENTO -->
  <div class="dark-overlay"></div>

  <!-- CANVAS DE FUMAÇA -->
  <canvas id="smokeCanvas"></canvas>

  <div class="main-canvas">

    <!-- TOPO: DIVISOR COM ESTRELAS -->
    <div class="stars-divider" style="opacity: 0.7;">
      <div class="line"></div>
      <div class="star-group">✦ ✦ ✦</div>
      <div class="line"></div>
    </div>

    <!-- TELA HERO -->
    <main class="screen-hero">
      
      <div class="center-brand-block">
        <div class="logo-symbol">
          <img src="logo.png" alt="Logotipo Natallyane Costa" class="brand-img">
        </div>
        <h1 class="brand-title">NATALLYANE COSTA</h1>
        <p class="brand-subtitle">MASSOTERAPEUTA</p>
      </div>

      <!-- ÁREA DE AÇÃO UNIFICADA (AGENDAR + INTERRUPTOR) -->
      <div class="action-area">
        <button id="btnAgendarEInterruptor" class="btn-agendar-unificado" aria-label="Agendar Sessão e Alternar Tema">
          <span class="btn-agendar-text">AGENDAR SESSÃO</span>
          
          <div class="right-switch-block">
            <svg class="switch-svg-clean" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
              <rect class="switch-border" x="20" y="10" width="60" height="100" rx="12" fill="none" stroke="#2c251d" stroke-width="3" />
              <rect class="switch-border-inner" x="26" y="16" width="48" height="88" rx="8" fill="none" stroke="#2c251d" stroke-width="1.5" />
              <rect class="switch-lever" x="35" y="30" width="30" height="40" rx="4" fill="#2c251d" />
              <g class="stars-group">
                <path d="M12 25 L14 30 L19 32 L14 34 L12 39 L10 34 L5 32 L10 30 Z" fill="#3b3226" />
                <path d="M85 85 L87 90 L92 92 L87 94 L85 99 L83 94 L78 92 L83 90 Z" fill="#3b3226" />
              </g>
            </svg>
          </div>
        </button>
      </div>

    </main>

    <!-- QUESTIONÁRIO (OCULTO INICIALMENTE) -->
    <section class="quiz-container hidden">
      <!-- Conteúdo do quiz permanece aqui -->
    </section>

    <!-- BOTÃO SOBRE MIM (CANTO INFERIOR ESQUERDO) -->
    <button id="btnSobreMim" class="btn-sobre-mim">
      <span>SOBRE MIM</span>
      <span class="arrow-down">↓</span>
    </button>

    <!-- RODAPÉ / DIVISOR INFERIOR -->
    <div class="stars-divider" style="opacity: 0.7;">
      <div class="line"></div>
      <div class="star-group">✦ ✦ ✦</div>
      <div class="line"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
