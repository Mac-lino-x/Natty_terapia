<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Pós-Sessão | Natty Terapia</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <main class="container">
        <h2>Como você está se sentindo? 🍃</h2>
        <p>Sua avaliação é fundamental para acompanharmos sua evolução.</p>

        <form id="formPos">
            <label for="whatsappPos">Seu WhatsApp (cadastrado):</label>
            <input type="tel" id="whatsappPos" required placeholder="(84) 99999-9999">

            <label for="nivelDorPos">Qual o nível da sua dor AGORA? (0 a 10):</label>
            <input type="number" id="nivelDorPos" min="0" max="10" required>

            <label for="feedback">Como foi a sua experiência com a sessão?</label>
            <textarea id="feedback" rows="4" placeholder="Conte-me como seu corpo reagiu às técnicas..."></textarea>

            <button type="submit" id="btnEnviarPos">Enviar Avaliação</button>
        </form>
    </main>

    <script src="main.js"></script>
</body>
</html>
