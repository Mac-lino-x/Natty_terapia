<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Pré-Sessão | Natty Terapia</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <main class="container">
        <h2>Ficha de Anamnese - Pré-Sessão 🌿</h2>
        <p>Preencha os dados abaixo para personalizarmos seu atendimento.</p>

        <form id="formPre">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" required placeholder="Seu nome">

            <label for="whatsapp">WhatsApp:</label>
            <input type="tel" id="whatsapp" required placeholder="(84) 99999-9999">

            <label for="queixa">Qual o local da sua dor ou desconforto principal?</label>
            <input type="text" id="queixa" required placeholder="Ex: Pescoço, lombar, ombros">

            <label for="nivelDor">Nível de Dor Atual (0 a 10):</label>
            <input type="number" id="nivelDor" min="0" max="10" required>

            <label for="historico">Possui alguma condição de saúde? (Gestação, Pressão Alta, Cirurgias):</label>
            <textarea id="historico" rows="3" placeholder="Caso não tenha, escreva Nenhuma"></textarea>

            <button type="submit" id="btnEnviarPre">Enviar Respostas</button>
        </form>
    </main>

    <script src="main.js"></script>
</body>
</html>
