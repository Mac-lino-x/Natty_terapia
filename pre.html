<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação Pré-Sessão - Natallyane Costa</title>
  <link rel="stylesheet" href="admin-pre-pos.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <audio id="somBip" src="audio/bip2.mp3" preload="auto"></audio>

  <div class="container-card container-card-flex">
    <div class="video-coluna">
      <!-- Renomeie o arquivo para video/pre.webm (sem espaços nem parênteses) -->
      <video src="video/pre.webm" autoplay loop muted playsinline aria-hidden="true"></video>
    </div>

    <div class="form-coluna">
      <h1>Avaliação Pré-Sessão</h1>

      <form id="formPre" novalidate>
        <!-- Campo armadilha anti-spam -->
        <div class="hp-field" aria-hidden="true">
          <label for="website">Não preencha</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="nomeCliente">Seu Nome:</label>
          <input type="text" id="nomeCliente" required maxlength="120" autocomplete="name" placeholder="Digite seu nome completo">
        </div>

        <div class="form-group">
          <label for="telefoneCliente">Telefone / WhatsApp:</label>
          <input type="tel" id="telefoneCliente" maxlength="16" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000">
        </div>

        <div class="form-group">
          <label for="tecnicaPre">Qual técnica será realizada?</label>
          <input type="text" id="tecnicaPre" required maxlength="80" placeholder="Ex: Massagem Relaxante">
        </div>

        <div class="form-group">
          <label for="nivelDor">Nível de dor / tensão atual:</label>
          <div class="dor-wrapper">
            <input type="range" id="nivelDor" min="0" max="10" value="0" aria-valuemin="0" aria-valuemax="10" aria-describedby="dorValor">
            <span class="dor-valor" id="dorValor" aria-live="polite">0</span>
          </div>
        </div>

        <div class="form-group">
          <label for="sintomasPre">Sintomas ou queixas:</label>
          <textarea id="sintomasPre" rows="2" maxlength="1000" placeholder="Ex: Dor lombar, ombros tensos..."></textarea>
        </div>

        <div class="form-group">
          <label for="restricoesPre">Restrições médicas (se houver):</label>
          <textarea id="restricoesPre" rows="2" maxlength="1000" placeholder="Ex: Gestante, hipertensão, nenhuma..."></textarea>
        </div>

        <div class="form-group">
          <label for="respPre">Como você está se sentindo hoje?</label>
          <textarea id="respPre" rows="2" required maxlength="1000" placeholder="Descreva seu estado físico e emocional atual..."></textarea>
        </div>

        <div class="check-group">
          <input type="checkbox" id="consentimento" required>
          <label for="consentimento">
            Autorizo o uso destes dados, inclusive informações de saúde, apenas para o planejamento e a realização do meu atendimento (LGPD). Posso solicitar a exclusão a qualquer momento.
          </label>
        </div>

        <p class="msg-erro" id="msgErro" role="alert"></p>

        <button type="submit" class="btn-acao" id="btnEnviarPre" style="width: 100%; margin-top: 6px;">Enviar Pré-Sessão</button>
      </form>
    </div>
  </div>

  <script>
    const somBip = document.getElementById('somBip');
    const sliderDor = document.getElementById('nivelDor');
    const dorValor = document.getElementById('dorValor');
    const btnEnviar = document.getElementById('btnEnviarPre');
    const msgErro = document.getElementById('msgErro');
    const inputTel = document.getElementById('telefoneCliente');

    sliderDor.addEventListener('input', () => {
      dorValor.textContent = sliderDor.value;
    });

    // Máscara simples (00) 00000-0000
    inputTel.addEventListener('input', () => {
      let n = inputTel.value.replace(/\D/g, '').slice(0, 11);
      if (n.length > 6) {
        n = n.length > 10
          ? `(${n.slice(0, 2)}) ${n.slice(2, 7)}-${n.slice(7)}`
          : `(${n.slice(0, 2)}) ${n.slice(2, 6)}-${n.slice(6)}`;
      } else if (n.length > 2) {
        n = `(${n.slice(0, 2)}) ${n.slice(2)}`;
      }
      inputTel.value = n;
    });

    function mostrarErro(texto) {
      msgErro.textContent = texto;
    }

    document.getElementById('formPre').addEventListener('submit', async (e) => {
      e.preventDefault();
      mostrarErro('');

      // Anti-spam: robôs costumam preencher o campo escondido
      if (document.getElementById('website').value) {
        window.location.href = 'index.html';
        return;
      }

      const nome = document.getElementById('nomeCliente').value.trim();
      const tecnica = document.getElementById('tecnicaPre').value.trim();
      const estado = document.getElementById('respPre').value.trim();
      const telefone = inputTel.value.trim();
      const digitos = telefone.replace(/\D/g, '');

      if (!nome || !tecnica || !estado) {
        mostrarErro('Preencha nome, técnica e como você está se sentindo.');
        return;
      }
      if (telefone && (digitos.length < 10 || digitos.length > 11)) {
        mostrarErro('Telefone inválido. Use DDD + número.');
        return;
      }
      if (!document.getElementById('consentimento').checked) {
        mostrarErro('É necessário autorizar o uso dos dados para enviar a ficha.');
        return;
      }
      if (!window.db) {
        mostrarErro('Sistema indisponível no momento. Tente novamente mais tarde.');
        return;
      }

      btnEnviar.disabled = true;
      btnEnviar.textContent = 'Enviando...';

      try {
        somBip.currentTime = 0;
        somBip.play().catch(() => {});
      } catch (err) {}

      const dados = {
        nome_cliente: nome,
        telefone: telefone || null,
        tecnica_desejada: tecnica,
        nivel_dor: parseInt(sliderDor.value, 10),
        sintomas_queixas: document.getElementById('sintomasPre').value.trim(),
        restricoes_medicas: document.getElementById('restricoesPre').value.trim(),
        respostas_pre: estado,
        consentimento_lgpd: true
      };

      const { error } = await window.db.from('pre_atendimento').insert([dados]);

      if (error) {
        console.error(error);
        mostrarErro('Erro ao enviar a ficha. Tente novamente.');
        btnEnviar.disabled = false;
        btnEnviar.textContent = 'Enviar Pré-Sessão';
      } else {
        alert('Pré-sessão enviada com sucesso!');
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
